<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #7f0101);
            color: white;
            text-align: center;
            padding: 40px;
            font-size: 28px;
        }
        h1 {
            font-size: 3.5rem;
            color: #facc15;
            text-shadow: 2px 2px #dc2626;
        }
        button {
            background: #dc2626;
            color: aquamarine;
            border: rgb(127, 83, 0);
            font-size: 1em;
            padding: 18px 30px;
            border-radius: 12px;
        }
        button:hover {
            background: #facc15;
            color: firebrick;
        }
        .quiz-container {
          position: relative;
          display: grid;
          grid-template-columns: minmax(0, 700px);
          justify-content: center;
        }
        .quiz-left {
          position: relative;
          z-index: 1;
        }
        .quiz-right {
          position: absolute;
          top: -110px;
          right: 0;
          z-index: 0;
        }
        .corner-left {
          position: absolute;
          left: 0;
          top: -110px;
          width: calc(30vw - 20px);
          max-width: 500px;
          z-index: 0;
          pointer-events: none;
        }
        .quiz-right img {
          width: 30vw;
          max-width: 520px;
          border-radius: 12px
        }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          15%, 55%, 85% { transform: translateX(-20px) rotate(-4deg); }
          35%, 70% { transform: translateX(20px) rotate(4deg); }
        }
        .shake {
          display: inline-block;
          animation: shake 0.3s ease-in-out 10;
        }
    </style>
</head>
<body>
   <h1>NINJAGO SUPER QUIZZ</h1>
   <p id="timer" style="color:#facc15;font-weight:bold;font-size:3rem;margin:10px 0;"></p>
   <div class="quiz-container">
<img class="corner-left" src="mira.png" alt="Dragon Jay flying with ice wings">
    <div class="quiz-left">
   <div id="question1">
   <p>who is the green ninja?</p>
   <button onclick="checkAnswer('LLOYD')">LLOYD</button>
   <button onclick="checkAnswer('FRAK')">FRAK</button>
   <P id="result"></P>
   </div>
   <div id="question2" style="display:none;">
   <p>who was the elemental master of smoke in 2025 ?</p>
   <button onclick="checkAnswer2('CINDER')">CINDER</button>
   <button onclick="checkAnswer2('ASH')">ASH</button>
   <p id="result2"></p>
   </div>
    <div id="question3" style="display:none;">
   <p>what is the name of dereth's dojo ?</p>
   <button onclick="checkAnswer3('MOJO DOJO')">MOJO DOJO
   </button>
   <button onclick="checkAnswer3('BROWN DOJO')">BROWN DOJO</button>
   <p id="result3"></p>
   </div>
   <div id="question4" style="display:none;">
   <p>who is kai's and nya's mother ?</p>
   <button onclick="checkAnswer4('MAYA')">MAYA
   </button>
   <button onclick="checkAnswer4('LILY')">LILY</button>
   <p id="result4"></p>
   </div>
    <div id="question5" style="display:none;">
   <p>who is the new character that is related to Lord Ras's tribe ?</p>
   <button onclick="checkAnswer5('ZILVAR')">ZILVAR
   </button>
   <button onclick="checkAnswer5('YOUNG ZERAS')">YOUNG ZERAS</button>
   <p id="result5"></p>
   </div>
   <div id="finalScore" style="display: none;">
    <h2>Your Score: <span id="scoreText"></span>/5</h2>
   </div>
   </div>
   <div class="quiz-right">
    <img src="pic.png" alt="LLOYD the legendary green ninja?">
   </div>
   </div>
   <script>
    let score = 0;
    const TIME_LIMIT = 15;
    let current = 1, timeLeft = TIME_LIMIT, timerId = null;
    let showingMsg = false;
    function updateTimer() {
      if (showingMsg) return;
      const t = document.getElementById('timer');
      t.textContent = '⏱ ' + timeLeft + 's';
      t.style.color = timeLeft <= 5 ? '#ff2a2a' : '#facc15';
    }
    function startTimer() {
      clearInterval(timerId);
      timeLeft = TIME_LIMIT;
      updateTimer();
      timerId = setInterval(function () {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) timeUp();
      }, 1000);
    }
    function timeUp() {
      document.getElementById("question" + current).style.display = "none";
      if (current < 5) {
        showQuestion(current + 1);
        document.getElementById("timer").textContent = "TIME'S UP! ⏰ Next question...";
        showingMsg = true;
        setTimeout(function () { showingMsg = false; updateTimer(); }, 3000);
      } else {
        finishQuiz();
      }
    }
    function showQuestion(n) {
      current = n;
      document.getElementById('question' + n).style.display = 'block';
      startTimer();
    }
    function finishQuiz() {
      clearInterval(timerId);
      document.getElementById('timer').style.display = 'none';
      document.getElementById('finalScore').style.display = 'block';
      document.getElementById('scoreText').textContent = score;
    }
    startTimer();
    function hideQuestion(btn) {
      btn.closest('div[id^="question"]').style.display = 'none';
    }
    function checkAnswer(choice) {
      document.getElementById('result').textContent = choice === 'LLOYD' ? 'Correct! 🥷🏻' : 'Nope, try again!';
      if (choice === 'LLOYD') {
        score = score + 1;
        hideQuestion(event.target);
        showQuestion(2);
      }
    }
    function checkAnswer2(choice) {
      document.getElementById('result2').textContent = choice === 'CINDER' ? 'CORRECT! 💨' : 'NOPE, TRY AGAIN!';
      if (choice === 'CINDER') {
        score = score + 1;
        hideQuestion(event.target);
        showQuestion(3);
      }

    }
    function checkAnswer3(choice) {
      document.getElementById('result3').textContent = choice === 'MOJO DOJO' ? 'CORRECT! 🟫' : 'NOPE, TRY AGAIN!';
      if (choice === 'MOJO DOJO') {
        score = score + 1;
        hideQuestion(event.target);
        showQuestion(4);
      }
    }
    function checkAnswer4(choice) {
      document.getElementById('result4').textContent = choice === 'MAYA' ? 'CORRECT! 💧' : 'NO, thats Cole\'s mother.';
      if (choice === 'MAYA') {
        score = score + 1;
        hideQuestion(event.target);
        showQuestion(5);
      }
    }
    function checkAnswer5(choice) {
      document.getElementById('result5').textContent = choice === 'ZILVAR' ? 'CORRECT! 🐯🩶' : 'WRONG! THATS LORD RAS\'S NAME.';
      if (choice === 'ZILVAR') {
        score = score + 1;
        hideQuestion(event.target);
      }
      finishQuiz();
    }
   </script>
</body>
</html>
