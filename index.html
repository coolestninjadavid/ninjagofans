<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #7f0101);
            color: white;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #facc15;
            text-shadow: 2px 2px #dc2626;
        }
        button {
            background: #dc2626;
            color: aquamarine;
            border: rgb(127, 83, 0);
            padding: 12px 20px;
            border-radius: 8px;
        }
        button:hover {
            background: #facc15;
            color: firebrick;
        }
    </style>
</head>
<body>
   <h1>NINJAGO SUPER QUIZZ</h1>
   <p>who is the green ninja?</p>
   <button onclick="checkAnswer('LLOYD')">LLOYD</button>
   <button onclick="checkAnswer('FRAK')">FRAK</button>
   <P id="result"></P>
<div id="question2" style="display: none;">
    <p>who was the elemental master of smoke in 2025 </p>
    <button onclick="checkAnswer2('CINDER')">CINDER</button>
    <button onclick="checkAnswer2('ASH')">ASH</button>
    <p id="result2"></p>
</div>
   <script>
    function checkAnswer(choice) {
      document.getElementById('result').textContent = choice === 'LLOYD' ? 'Correct! 🥷🏻' : 'Nope, try again!';
      if (choice === 'LLOYD') {
        document.getElementById('question2').style.display = 'block';
      }
    }
    function checkAnswer2(choice) {
        document.getElementById('result2').textContent = choice === 'CINDER' ? 'CORRECT! 💨' : 'NOPE, TRY AGAIN!';
    }
   </script>
</body>
</html>
